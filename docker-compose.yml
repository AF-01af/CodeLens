services:
  postgres:
    image: postgres:16-alpine
    container_name: codelens-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codelens}
      POSTGRES_USER: ${POSTGRES_USER:-codelens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codelens}
    volumes:
      - codelens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codelens} -d ${POSTGRES_DB:-codelens}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codelens_pgdata:
