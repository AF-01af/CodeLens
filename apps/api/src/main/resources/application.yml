spring:
  application:
    name: codelens-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codelens}
    username: ${POSTGRES_USER:codelens}
    password: ${POSTGRES_PASSWORD:codelens}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

codelens:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
