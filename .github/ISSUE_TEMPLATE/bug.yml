name: Bug
description: Something is broken or unexpected
labels: ["bug"]
body:
  - type: textarea
    id: report
    attributes:
      label: What happened
      description: What you saw, and the smallest way to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: frontend, backend, docs, CI, other
      placeholder: backend
    validations:
      required: true
