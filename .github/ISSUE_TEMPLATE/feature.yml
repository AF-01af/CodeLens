name: Feature
description: Propose a new CodeLens behavior
labels: ["feature"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: User-visible reason for this work.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: What should happen when this is done.
      placeholder: |
        - Professor can create an assignment with a due date.
        - Students see the assignment on their course page.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Adjacent work this issue deliberately skips.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: How to verify
      description: Concrete checks for the implementer and reviewer.
    validations:
      required: true
